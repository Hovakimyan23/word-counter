<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Analyzer</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-hover: #334155;
            --border: #334155;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px 16px;
            line-height: 1.5;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 6px;
            background: linear-gradient(135deg, var(--accent), #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        textarea {
            width: 100%;
            height: 220px;
            background: var(--surface);
            color: var(--text);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            font-size: 1rem;
            font-family: inherit;
            line-height: 1.6;
            resize: vertical;
            transition: border-color 0.2s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        .actions {
            display: flex;
            gap: 12px;
            margin: 16px 0 24px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 22px;
            font-size: 0.95rem;
            font-family: inherit;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--accent);
            color: #0f172a;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--surface-hover);
        }

        .btn-copy {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .btn-copy:hover {
            color: var(--text);
            border-color: var(--accent);
        }

        #results {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }

        .result-item {
            background: var(--surface);
            padding: 18px;
            border-radius: 12px;
            border: 1px solid var(--border);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .result-item:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .result-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .result-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text);
        }

        .result-value .unit {
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-muted);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text);
        }

        #wordFrequency {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
        }

        .freq-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .freq-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .freq-word {
            min-width: 120px;
            color: var(--text);
            font-size: 0.9rem;
        }

        .freq-bar-bg {
            flex: 1;
            height: 8px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .freq-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #818cf8);
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        .freq-count {
            font-size: 0.85rem;
            color: var(--text-muted);
            min-width: 30px;
            text-align: right;
        }

        .empty-state {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: center;
            padding: 12px;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--success);
            color: #0f172a;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 600px) {
            #results {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Text Analyzer</h1>
            <p class="subtitle">Paste or type your text below — analysis updates live</p>
        </header>

        <textarea id="textInput" placeholder="Start typing or paste your text here..."></textarea>

        <div class="actions">
            <button class="btn-primary" onclick="analyzeText()">Analyze</button>
            <button class="btn-secondary" onclick="clearText()">Clear</button>
            <button class="btn-copy" onclick="copyResults()">Copy Results</button>
        </div>

        <div id="results">
            <div class="result-item">
                <div class="result-label">Letters</div>
                <div class="result-value"><span id="letterCount">0</span></div>
            </div>
            <div class="result-item">
                <div class="result-label">Words</div>
                <div class="result-value"><span id="wordCount">0</span></div>
            </div>
            <div class="result-item">
                <div class="result-label">Sentences</div>
                <div class="result-value"><span id="sentenceCount">0</span></div>
            </div>
            <div class="result-item">
                <div class="result-label">Paragraphs</div>
                <div class="result-value"><span id="paragraphCount">0</span></div>
            </div>
            <div class="result-item">
                <div class="result-label">Characters (with spaces)</div>
                <div class="result-value"><span id="charCount">0</span></div>
            </div>
            <div class="result-item">
                <div class="result-label">Characters (no spaces)</div>
                <div class="result-value"><span id="charNoSpaceCount">0</span></div>
            </div>
            <div class="result-item">
                <div class="result-label">Avg. Word Length</div>
                <div class="result-value"><span id="avgWordLength">0</span><span class="unit"> chars</span></div>
            </div>
            <div class="result-item">
                <div class="result-label">Reading Time</div>
                <div class="result-value"><span id="readingTime">0</span><span class="unit"> sec</span></div>
            </div>
        </div>

        <div id="wordFrequency">
            <div class="section-title">Most Frequent Words</div>
            <div id="freqList" class="freq-list">
                <div class="empty-state">Start typing to see word frequency</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Results copied to clipboard!</div>

    <script>
        const textInput = document.getElementById('textInput');

        textInput.addEventListener('input', analyzeText);

        function analyzeText() {
            const text = textInput.value;

            const letterCount = (text.match(/[a-zA-Zа-яА-ЯёЁ]/g) || []).length;

            const words = text.trim().split(/\s+/).filter(word => word.length > 0);
            const wordCount = words.length;

            const sentenceCount = text.split(/[.!?…]+/).filter(s => s.trim().length > 0).length;

            const paragraphCount = text.split(/\n+/).filter(p => p.trim().length > 0).length;

            const charCount = text.length;
            const charNoSpaceCount = text.replace(/\s/g, '').length;

            const totalLetters = words.reduce((sum, w) => sum + w.length, 0);
            const avgWordLength = wordCount > 0 ? (totalLetters / wordCount).toFixed(1) : 0;

            const readingTime = wordCount > 0 ? Math.max(1, Math.ceil(wordCount / 3.33)) : 0;

            document.getElementById('letterCount').textContent = letterCount;
            document.getElementById('wordCount').textContent = wordCount;
            document.getElementById('sentenceCount').textContent = sentenceCount;
            document.getElementById('paragraphCount').textContent = paragraphCount;
            document.getElementById('charCount').textContent = charCount;
            document.getElementById('charNoSpaceCount').textContent = charNoSpaceCount;
            document.getElementById('avgWordLength').textContent = avgWordLength;
            document.getElementById('readingTime').textContent = readingTime;

            updateWordFrequency(words);
        }

        function updateWordFrequency(words) {
            const freqList = document.getElementById('freqList');

            if (words.length === 0) {
                freqList.innerHTML = '<div class="empty-state">Start typing to see word frequency</div>';
                return;
            }

            const freq = {};
            words.forEach(w => {
                const key = w.toLowerCase().replace(/[^a-zа-яё0-9]/gi, '');
                if (key.length === 0) return;
                freq[key] = (freq[key] || 0) + 1;
            });

            const sorted = Object.entries(freq)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5);

            if (sorted.length === 0) {
                freqList.innerHTML = '<div class="empty-state">No words to analyze</div>';
                return;
            }

            const maxCount = sorted[0][1];

            freqList.innerHTML = sorted.map(([word, count]) => {
                const widthPct = (count / maxCount) * 100;
                return `
                    <div class="freq-item">
                        <span class="freq-word">${escapeHtml(word)}</span>
                        <div class="freq-bar-bg"><div class="freq-bar" style="width: ${widthPct}%"></div></div>
                        <span class="freq-count">${count}</span>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function clearText() {
            textInput.value = '';
            analyzeText();
            textInput.focus();
        }

        function copyResults() {
            const results = document.getElementById('results');
            const lines = [];

            results.querySelectorAll('.result-item').forEach(item => {
                const label = item.querySelector('.result-label').textContent;
                const value = item.querySelector('.result-value').textContent.trim();
                lines.push(`${label}: ${value}`);
            });

            const text = 'Text Analyzer Results\n' + '='.repeat(30) + '\n' + lines.join('\n');

            navigator.clipboard.writeText(text).then(() => {
                showToast();
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast();
            });
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        analyzeText();
    </script>
</body>
</html>
